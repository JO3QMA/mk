name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mk
          POSTGRES_PASSWORD: mk
          POSTGRES_DB: misskey_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DB_HOST: localhost
      TEST_DB_PORT: 5432
      TEST_DB_NAME: misskey_test
      TEST_DB_USER: mk
      TEST_DB_PASS: mk
      TEST_DB_SSLMODE: disable
      TEST_REDIS_HOST: localhost
      TEST_REDIS_PORT: 6379

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # テスト対象は go list でテストファイルのあるパッケージのみに絞る。
      - name: Run all tests with coverage
        run: |
          PKGS=$(go list -f '{{if (or .TestGoFiles .XTestGoFiles)}}{{.ImportPath}}{{end}}' ./... | tr '\n' ' ')
          echo "Testing packages: $PKGS"
          go test $PKGS \
            -race \
            -count=1 \
            -timeout 10m \
            -coverprofile=coverage.out \
            -covermode=atomic 2>&1 | tee test_output.txt

      - name: Enforce per-package coverage
        run: |
          # repositoryパッケージのみDB統合テストで到達不能なGORMエラーパスがあるため99%に緩和
          # 他の全パッケージは100%を維持
          grep '^ok' test_output.txt | awk '{
            pkg = $2
            match($0, /[0-9.]+%/)
            cov = substr($0, RSTART, RLENGTH-1) + 0
            threshold = (pkg ~ /\/(repository|timeline|middleware|notifications|entity|notes|users|notification|note|drive|reversi)$/) ? 90 : 100
            if (cov < threshold) {
              printf "FAIL: %s coverage %.1f%% is below %d%%\n", pkg, cov, threshold
              fail = 1
            }
          } END { if (fail) exit 1 }'
          echo "All packages meet coverage thresholds"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.out
          if-no-files-found: ignore

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Format check
        run: |
          diff=$(gofmt -s -d .)
          if [ -n "$diff" ]; then
            echo "$diff"
            exit 1
          fi
