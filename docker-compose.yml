services:
  app:
    build: .
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # フロントエンドアセットをコンテナ外からマウントする場合に設定
      # MISSKEY_FRONTEND_DIR: /app/frontend
      # MISSKEY_FRONTEND_DIST_DIR: /app/frontend_dist
      # MISSKEY_TWEMOJI_DIR: /app/twemoji
      # MISSKEY_STATIC_DIR: /app/static
      # MISSKEY_REPO_ASSETS_DIR: /app/repo-assets
      TZ: Asia/Tokyo
    volumes:
      # コンテナは UID/GID 991 (Misskey TS 互換) で起動するので、
      # ./files は UID 991 が書き込める所有権でなければならない (#621)。
      # 旧 root 構成から upgrade する場合は一度
      # `sudo chown -R 991:991 ./files` を実行すること。
      - ./files:/app/drive-files
      # 設定ファイルを上書きする場合 (cp .config/docker.yml.example
      # .config/docker.yml して編集後にコメントを外す):
      # - ./.config/docker.yml:/app/.config/default.yml:ro
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: misskey
      POSTGRES_USER: misskey
      POSTGRES_PASSWORD: misskey
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U misskey"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Video thumbnail generator (#637 M2). mk-go の media proxy が video/* を
  # 受けたとき、設定 `videoThumbnailGenerator` で指定した URL に GET を投げて
  # 静止画 thumbnail を取得する。app コンテナとは Docker network 内で通信し、
  # 公開ポートは持たない (origin 側は mk-go の /proxy 経由でしか到達しない)。
  #
  # mk-go 側で `videoThumbnailGenerator: http://video-thumb:8080` を設定する
  # ことで wire される。UDS deployment では deploy/uds/docker-compose.yml で
  # socket mount に切り替える (`unix:///var/run/video-thumb/sock`)。
  video-thumb:
    image: nekonoverse/video-thumb:latest
    restart: unless-stopped

volumes:
  db_data:
  redis_data:
